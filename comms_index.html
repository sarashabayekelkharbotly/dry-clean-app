<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>التواصل — OWH</title>
<!-- ADD-TO-HOME-SCREEN (Sarah 2026-08-12: Dani's shortcut showed a plain "G"). Android needs a
     manifest with a ≥192px icon to make a real app icon; without one Chrome writes a letter badge.
     apple-touch-icon covers iPhones, rel=icon the browser tab. -->
<link rel="manifest" href="comms.webmanifest">
<link rel="icon" href="owh-icon-192.png">
<link rel="apple-touch-icon" href="owh-icon-192.png">
<meta name="theme-color" content="#cc5f5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="التواصل">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root { --bg:#f9f0f0; --card:#ffffff; --border:#f0e0e0; --text1:#3d3436; --text2:#8a7a7d; --text3:#b5a5a8;
  --primary:#cc5f5f; --ok:#5caa7f; --warn:#c9a24b; --danger:#a84545; --blue:#4285f4; }
* { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
body { background:var(--card); color:var(--text1); padding-bottom:80px; }   /* white ground, like الكنترول (Sarah 2026-08-18) */
.hdr { position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; gap:10px; }
.hdr h1 { font-size:17px; font-weight:900; flex:1; }
.pill { font-size:10px; color:var(--text3); }
.wrap { padding:14px 14px 0; max-width:640px; margin:0 auto; }
.tabs { position:sticky; top:53px; z-index:19; background:var(--card); display:flex; justify-content:center; gap:2px; padding:6px 8px; overflow-x:auto; border-bottom:1px solid var(--border); }
.tab { flex:1; max-width:88px; display:flex; flex-direction:column; align-items:center; gap:2px; border:none; background:none; border-radius:10px; padding:6px 4px; font-size:10.5px; font-weight:700; color:var(--text2); cursor:pointer; text-align:center; }
.tab .tab-icon { font-size:19px; display:block; }
.tab.on { background:var(--bg); color:var(--primary); }
.card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:12px; }
.stay-hd { display:flex; align-items:center; gap:8px; cursor:pointer; }
.stay-nm { font-weight:900; font-size:14px; flex:1; unicode-bidi:isolate; }
.stay-meta { font-size:11px; color:var(--text2); margin-top:2px; direction:rtl; unicode-bidi:plaintext; text-align:right; }
.badge { font-size:10.5px; font-weight:700; border-radius:8px; padding:2px 8px; flex-shrink:0; }
.b-due { background:rgba(204,95,95,.12); color:var(--danger); }
.b-ok { background:rgba(92,170,127,.12); color:var(--ok); }
.b-soon { background:rgba(201,162,75,.14); color:#8a6d1f; }
.step { display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px dashed var(--border); }
.step-lb { flex:1; font-size:12.5px; }
.step-sub { font-size:10.5px; color:var(--text3); }
.done .step-lb { color:var(--text3); text-decoration:line-through; }
.btn { border:1.5px solid var(--border); background:var(--card); border-radius:10px; padding:5px 10px; font-size:11.5px; font-weight:700; cursor:pointer; color:var(--text1); }
.btn-ok { background:var(--ok); border-color:var(--ok); color:#fff; }
.btn:disabled { opacity:.5; }
.wa { text-decoration:none; font-size:15px; }
.due-row { background:rgba(204,95,95,.05); border:1px solid rgba(204,95,95,.25); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
/* HOME READS LIKE الكنترول's (Sarah 2026-08-18) — she finds it much clearer, and two screens the
   same team uses all day should not need two different reading habits. White ground, the section
   title large and BLACK, and only the person it belongs to in the house pink, so a glance answers
   "whose is this" before you read a word. */
.sec-h { font-size:15px; font-weight:900; color:var(--text1); margin:18px 0 8px; letter-spacing:0; }
.sec-h .who { color:var(--primary); }
.sec-h .n { color:var(--text3); font-weight:700; font-size:12.5px; }
.home-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:4px 14px 8px; margin-bottom:12px; }
/* one row: tickbox · text · actions — the emoji column is fixed so the text starts on one line */
.trow { display:flex; gap:8px; align-items:flex-start; padding:8px 0; border-bottom:1px solid #f4ecec; }
.trow:last-child { border-bottom:0; }
.trow .tk { font-size:15px; flex-shrink:0; line-height:1.35; }
.trow .tx { flex:1; font-size:13px; line-height:1.6; }
.trow .tx b { font-weight:800; }
/* DONE IS STRUCK THROUGH, NOT GONE (Sarah 2026-08-18). A line that vanishes the moment it is
   ticked takes its own evidence with it — you cannot see that it was done, or undo it. */
.trow.is-done .tx { text-decoration:line-through; opacity:.45; }
.trow .sub { font-size:10.5px; color:var(--text3); margin-top:2px; }
.trow .nm { color:var(--primary); font-weight:700; }
.trow .late { color:var(--danger); font-weight:800; }
.trow .tm { font-weight:800; color:var(--text1); }
.day-h { font-size:12px; font-weight:900; color:var(--primary); margin:12px 0 6px; }
.line { display:flex; gap:8px; align-items:center; font-size:12.5px; padding:6px 0; border-bottom:1px dashed var(--border); }
.banner { font-size:11px; color:#8a6d1f; background:rgba(201,162,75,.12); border-radius:10px; padding:6px 10px; margin-bottom:10px; }
.inp { width:100%; border:1.5px solid var(--border); border-radius:10px; padding:8px 10px; font-size:13px; margin-bottom:8px; background:#fff; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; border-radius:12px; padding:10px 18px; font-size:13px; z-index:99; opacity:0; transition:.3s; pointer-events:none; max-width:90vw; }
.toast.show { opacity:1; }
#loginScreen { position:fixed; inset:0; background:var(--bg); z-index:50; display:none; align-items:center; justify-content:center; transition:opacity .3s; }
.login-box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:26px 22px; width:88%; max-width:340px; }
.login-box h2 { font-size:17px; font-weight:900; margin-bottom:14px; text-align:center; }
#loginError { display:none; color:var(--danger); font-size:12px; margin-bottom:8px; text-align:center; }
.lbtn { width:100%; background:var(--primary); color:#fff; border:none; border-radius:10px; padding:10px; font-size:14px; font-weight:800; cursor:pointer; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h2>📨 شاشة التواصل</h2>
    <div id="loginError"></div>
    <input class="inp" id="loginUsername" placeholder="اسم المستخدم" autocomplete="username">
    <input class="inp" id="loginPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password">
    <button class="lbtn" id="loginBtn" onclick="doLogin()">دخول</button>
  </div>
</div>

<div class="hdr">
  <h1>📨 التواصل مع الضيوف</h1>
  <span class="pill">v18</span>
  <span class="pill" id="agePill"></span>
  <button class="btn" id="briefBtn" style="display:none" onclick="sendBriefNow()" title="إرسال خطة اليوم / ملخص المساء دلوقتي">☀️</button>
  <button class="btn" id="homeBtn" style="display:none" onclick="window.location.href='index.html'" title="الرجوع للكنترول">🏠</button>
  <button class="btn" id="langBtn" onclick="toggleTplLang()" title="لغة رسائل الضيوف الافتراضية">🌐 EN</button>
  <button class="btn" id="syncAllBtn" onclick="syncAll()" title="مزامنة شاملة — سموبو ← الهب ← كل الشاشات">🔄</button>
  <button class="btn" onclick="loadData(true)">↻</button>
  <button class="btn" id="switchUserBtn" style="display:none" onclick="showSwitchUser()">🚪</button>
</div>

<div class="tabs">
  <div class="tab on" data-p="queue" onclick="showTab('queue',this)"><span class="tab-icon">🏠</span>الرئيسية</div>
  <div class="tab" data-p="stays" onclick="showTab('stays',this)"><span class="tab-icon">🛎️</span>الحجوزات</div>
  <div class="tab" data-p="sched" onclick="showTab('sched',this)"><span class="tab-icon">🧹</span>الجدول</div>
  <div class="tab" data-p="rep" onclick="showTab('rep',this)"><span class="tab-icon">🔧</span>صيانة</div>
  <div class="tab" data-p="task" onclick="showTab('task',this)"><span class="tab-icon">➕</span>مهمة</div>
  <div class="tab" data-p="log" onclick="showTab('log',this)"><span class="tab-icon">📜</span>السجل</div>
</div>

<div class="wrap">
  <div id="bannerBox"></div>
  <div id="p-queue"></div>
  <div id="p-stays" style="display:none"></div>
  <div id="p-sched" style="display:none"></div>
  <div id="p-rep" style="display:none"></div>
  <div id="p-task" style="display:none"></div>
  <div id="p-log" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzsBCw9HrbnW7lVHeaRQF6FIqM9mERoTd0a34S_zvUnhaCsdFlbsGthYtoZggfNI6YgvQ/exec';
const SCRIPT_URL_AUTH = SCRIPT_URL;
let currentUser=null, currentUserName=null, currentUserRole=null;
let D = { stays:[], schedule:[], repairs:[], tasks:[], today:'' };
let lastTs = 0;

/* ---- session plumbing (the الكنترول pattern: sid merged into every POST) ---- */
function owhSid(){ try{ const s=JSON.parse(localStorage.getItem('owh_session')||'null'); return (s&&s.sid)?s.sid:''; }catch(e){ return ''; } }
(function(){
  const _fetch=window.fetch.bind(window);
  window.fetch=function(url,opts){
    let o=opts;
    if(typeof url==='string'&&url.indexOf(SCRIPT_URL)===0&&o&&typeof o.body==='string'){
      try{ const b=JSON.parse(o.body);
        if(b&&b.action&&b.action!=='auth_login'&&!b.sid){ const sid=owhSid(); if(sid){ b.sid=sid; o=Object.assign({},o,{body:JSON.stringify(b)}); } }
      }catch(e){}
    }
    return _fetch(url,o).then(function(res){
      if(typeof url==='string'&&url.indexOf(SCRIPT_URL)===0){
        res.clone().json().then(function(j){ if(j&&j.ok===false&&j.code==='AUTH') owhSessionExpired(); }).catch(function(){});
      }
      return res;
    });
  };
})();
let owhExpiredShown=false;
function owhSessionExpired(){
  if(owhExpiredShown) return; owhExpiredShown=true;
  localStorage.removeItem('owh_session'); currentUser=null;
  document.getElementById('loginScreen').style.display='flex';
  const e=document.getElementById('loginError'); e.textContent='انتهت الجلسة — سجّل الدخول مرة أخرى'; e.style.display='block';
}
function initAuth(){
  const saved=localStorage.getItem('owh_session');
  if(saved){ try{ const s=JSON.parse(saved);
    if(s&&s.username&&s.sid){ currentUser=s.username; currentUserName=s.displayName; currentUserRole=s.role; hideLoginScreen(); return; }
    localStorage.removeItem('owh_session');
  }catch(e){ localStorage.removeItem('owh_session'); } }
  document.getElementById('loginScreen').style.display='flex';
}
async function doLogin(){
  const username=document.getElementById('loginUsername').value.trim();
  const password=document.getElementById('loginPassword').value.trim();
  if(!username||!password){ showLoginError('أدخل اسم المستخدم وكلمة المرور'); return; }
  const btn=document.getElementById('loginBtn'); btn.textContent='⏳'; btn.disabled=true;
  try{
    const res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'auth_login',username,password})});
    const data=await res.json();
    if(data.ok){ currentUser=data.username; currentUserName=data.displayName; currentUserRole=data.role;
      localStorage.setItem('owh_session',JSON.stringify(data)); hideLoginScreen(); }
    else showLoginError(data.error||'خطأ في تسجيل الدخول');
  }catch(e){ showLoginError('خطأ في الاتصال — تحقق من الإنترنت'); }
  btn.textContent='دخول'; btn.disabled=false;
}
function showLoginError(m){ const e=document.getElementById('loginError'); e.textContent=m; e.style.display='block'; }
function hideLoginScreen(){
  const el=document.getElementById('loginScreen');
  if(el){ el.style.opacity='0'; setTimeout(()=>el.style.display='none',300); }
  document.getElementById('switchUserBtn').style.display='block';
  if(currentUser==='sarah'||currentUser==='khaled'){
    const hb=document.getElementById('homeBtn'); if(hb) hb.style.display='';
    const bb=document.getElementById('briefBtn'); if(bb){ bb.style.display=''; bb.textContent=(new Date().getHours()>=17)?'🌙':'☀️'; }
  }
  hydrate(); loadData(false);
}
function showSwitchUser(){
  const sid=owhSid();
  if(sid){ try{ window.fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'auth_logout',sid})}).catch(function(){}); }catch(e){} }
  localStorage.removeItem('owh_session'); currentUser=null;
  document.getElementById('switchUserBtn').style.display='none';
  const el=document.getElementById('loginScreen'); el.style.opacity='1'; el.style.display='flex';
}

/* ---- api + cache-first paint with an honest age banner (house style) ---- */
/* A call with no timeout is a screen with no answer (Sarah 2026-08-20: "there is no response") —
   the browser will happily wait minutes on a stalled request. 35s cap; the retry wrapper below
   decides what happens next, the user is never left staring. */
async function api(action, extra={}, timeoutMs=35000){
  const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),timeoutMs);
  try{
    const res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action},extra)),signal:ctl.signal});
    return await res.json();
  } finally { clearTimeout(timer); }
}
/* SAVES RETRY THEMSELVES (2026-08-20). One stalled write holds the server lock for minutes; every
   save behind it used to wait 20s, fail, and paint ❌ لم يُحفظ for work that only needed a second
   attempt — Sarah then retried by hand, which is exactly what this does, minus the false alarm.
   Safe because a tick is idempotent (same row, same end state) and the server now dedupes the
   telegram, so a retry can never announce twice. Three attempts, backing off, saying what it is
   doing; the honest ❌ survives for the case where all three really failed. */
async function apiRetry(action, extra={}){
  const waits=[0,4000,10000];
  for(let a=0;a<waits.length;a++){
    if(waits[a]){ toast('⏳ لسه بيحفظ — محاولة تانية…'); await new Promise(r=>setTimeout(r,waits[a])); }
    try{
      const r=await api(action, extra);
      if(r&&r.ok===true) return r;
      if(!(r&&r.code==='BUSY')) return r;          // a real answer, even a bad one — no point retrying
    }catch(e){ /* timeout or network — the save may be mid-flight; retry overwrites to the same state */ }
  }
  return null;
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),3200); }
/* 🔄 مزامنة شاملة (Sarah 2026-08-22) — the same hub_sync_all الكنترول uses: Smoobu → the Hub →
   every cache dropped, so bookings, cleans and repairs land here AND on Emad's screen in one press.
   The run takes ~1 minute, well past the normal 35s guard, so this call gets 5 minutes of its own;
   if the network drops mid-run the server keeps going, and we poll hub_sync_status until it answers
   — the same wait-don't-relaunch rule as الكنترول (relaunching would just hit the BUSY lock). */
async function syncAll(){
  const b=document.getElementById('syncAllBtn'); const since=Date.now();
  b.disabled=true;
  const tick=setInterval(()=>{ b.textContent='⏳'+Math.round((Date.now()-since)/1000)+'ث'; },1000);
  let r=null;
  try{ r=await api('hub_sync_all',{},300000); }
  catch(e){ r=await syncWatch(); }
  clearInterval(tick); b.disabled=false; b.textContent='🔄';
  if(r&&r.code==='BUSY'){ toast('⏳ '+(r.error||'المزامنة شغالة دلوقتي — استنى شوية')); return; }
  if(!r||r.ok!==true){ toast('❌ فشلت المزامنة — '+((r&&r.error)||'حاول مرة أخرى')); return; }
  toast('✅ تمت المزامنة — بيحدّث الشاشة…');
  loadData(true); refreshRepairs();
}
async function syncWatch(){
  for(let i=0;i<24;i++){                                   // up to 6 minutes, checking every 15s
    await new Promise(res=>setTimeout(res,15000));
    try{ const s=await api('hub_sync_status'); if(s&&!s.running) return s.result||{ok:true}; }catch(e){}
  }
  return null;
}
const CK='owh_comms_cache_v2';   // v2: handover/group/lang/requests/notes on every stay
function hydrate(){
  try{ const c=JSON.parse(localStorage.getItem(CK)||'null');
    if(c&&c.D){ D=c.D; lastTs=c.ts||0; renderAll();
      const mins=Math.round((Date.now()-lastTs)/60000);
      document.getElementById('bannerBox').innerHTML=`<div class="banner">🕐 نسخة من ${mins<2?'لحظات':mins+' دقيقة'} — جاري التحديث…</div>`;
    } }catch(e){}
}
async function loadData(force){
  try{
    const r=await api('comms_home',{force:!!force});
    if(r&&r.ok){ D=r; lastTs=Date.now();
      try{ localStorage.setItem(CK,JSON.stringify({D,ts:lastTs})); }catch(e){}
      document.getElementById('bannerBox').innerHTML='';
      refreshRepairs();
      document.getElementById('agePill').textContent='';
      renderAll();
    } else { document.getElementById('bannerBox').innerHTML=`<div class="banner">⚠️ التحديث فشل — السبب: ${(r&&r.error)||'غير معروف'}</div>`; }
  }catch(e){ document.getElementById('bannerBox').innerHTML=`<div class="banner">⚠️ التحديث فشل — السبب: انقطاع الاتصال</div>`; }
}

/* ---- guest message templates, EN + AR (sent from Dani's own WhatsApp) ----
   Language per guest: the stay's 🌐 field wins when it clearly says AR or EN;
   otherwise the header EN/AR toggle sets the default. */
/* §5.5: A GUEST'S CODE IS THEIR ARRIVAL DATE, DDMM. This used to read the code off the most recent
   visit on or before check-in, which is a different thing entirely — it is whatever was keyed in
   last, not what this guest is entitled to. Mona Alqahtani booked Zayed 2000 on her own check-in
   day; the newest row before her was the 15-Aug checkout carrying the default 0107, so that is the
   code she was sent (Sarah 2026-08-16). A visit does not DEFINE the code, it only decides whether
   anybody has physically set it — so the code is derived, and the visits are used to answer the
   separate question of whether it is real yet. */
function ciAdd(ci,n){ const d=new Date(ci+'T12:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function codeNeed(st){ const ci=String(st.ci||''); return ci?ci.slice(8,10)+ci.slice(5,7):''; }
function codeFor(st){
  const need=codeNeed(st); if(!need) return '〈CODE〉';
  const from=ciAdd(st.ci,-2), today=(D&&D.today)||'';
  /* A hand-set code (✎ in the Hub, `edited` in the payload) IS the arrival's code — even when its
     visit already happened (Amina 2026-08-22: Emad set 2108 the day before and the guest message
     still carried the mechanical 2208). The old still-to-come heuristic stays as a fallback for
     rows confirmed before the flag existed. */
  let hand=null;
  (D.schedule||[]).forEach(c=>{ if(c.flat===st.flat&&c.code&&c.date>=from&&c.date<=st.ci&&(c.edited||(c.date>=today&&c.code!==need))&&(!hand||c.date>hand.date)) hand=c; });
  return hand?hand.code:need;
}
/* Has anyone actually been asked to set it? Same test as the Hub and as الكنترول's watcher: some
   visit inside the two-day window carrying exactly this code — or a hand-set one, which IS the
   plan by decision. If neither, the lock still holds the old code and the message must not go out
   as if it were true. */
function codeIsSet(st){
  const need=codeNeed(st), from=ciAdd(st.ci,-2), today=(D&&D.today)||st.ci;
  // guest already in → a visit any time up to today can be the one that set it; still to come →
  // it has to happen by the arrival day, or they reach a door that has not been changed
  const upto = st.ci>today ? st.ci : today;
  return (D.schedule||[]).some(c=>c.flat===st.flat&&c.date>=from&&c.date<=upto&&((c.code||'')===need||c.edited));
}
function firstName(g){ return String(g||'').trim().split(/\s+/)[0]||'there'; }
function tplDefLang(){ return localStorage.getItem('owh_tpl_lang')==='ar'?'ar':'en'; }
function toggleTplLang(){
  const v=tplDefLang()==='ar'?'en':'ar';
  localStorage.setItem('owh_tpl_lang',v);
  const b=document.getElementById('langBtn'); if(b) b.textContent='🌐 '+v.toUpperCase();
  toast('لغة الرسائل الافتراضية: '+(v==='ar'?'عربي':'English'));
}
function tplLang(st){
  const l=String(st.lang||'');
  if(/ar|عرب/i.test(l)) return 'ar';
  if(/en/i.test(l)) return 'en';
  return tplDefLang();
}
/* اللغة والنوع الأول (Sarah 2026-08-11): أول نسخ لرسالة ضيف من غير 🌐/⚥ بيسأل عليهم قبل ما
   ينسخ — علشان أول رسالة تطلع صح من أول مرة. */
/* COPY MUST BE INSTANT (Sarah 2026-08-12: "it asks for the gender again, and copying is slow").
   Two causes: the server saved gender but never returned it, so every refresh forgot it — and the
   copy waited for that save before touching the clipboard. Now the answers are taken locally, the
   text is copied immediately, and the save rides in the background. */
function saveField(stayId,step,val){
  const st=D.stays.find(s=>s.id===stayId);
  api('comms_tick',{stayId,step,occ:'',val,tag:st?tagOf(st):''})
    .then(r=>{ if(!r||r.ok!==true) toast('⚠️ «'+step+'» لم تُحفظ — جرّب تاني'); })
    .catch(()=>toast('⚠️ «'+step+'» لم تُحفظ — جرّب تاني'));
  try{ localStorage.setItem(CK,JSON.stringify({D,ts:lastTs})); }catch(e){}
}
function ensureLangGender(st){
  if(!st.lang){
    const v=prompt('🌐 لغة التواصل مع الضيف (EN أو AR):','EN');
    if(v===null) return false;
    const lv=String(v).trim().toUpperCase(); if(!lv){ toast('اكتب EN أو AR'); return false; }
    st.lang=lv; saveField(st.id,'lang',lv);
  }
  if(!st.gender){
    const g=prompt('⚥ نوع الضيف: m رجل · f سيدة · g مجموعة/عائلة','m');
    if(g===null) return false;
    const gv={m:'m',f:'f',g:'g'}[String(g).trim().toLowerCase()]; if(!gv){ toast('اكتب m أو f أو g'); return false; }
    st.gender=gv; saveField(st.id,'gender',gv);
  }
  return true;
}
/* 📍 THE FLAT'S MAP PIN (Sarah 2026-08-19). This step has no message to word — the link is the whole
   of it, one per apartment, so the copy button puts the pin on the clipboard and nothing else. Kept
   as data here rather than inside the templates because it is the same in both languages. */
const FLAT_PIN={
  '8A':'https://goo.gl/maps/k5P3q853uDZy3STf6',
  '17A':'https://goo.gl/maps/NgzPXTvYhzMWpAXP8',
  '28A':'https://maps.app.goo.gl/E9C3dJy4MMPzFA7N8',
  'Zayed 2000':'https://maps.app.goo.gl/ZoXaN4DijpW2BidP8'
};
function pinFor(st){ return (st&&FLAT_PIN[st.flat])||''; }
function copyTpl(stayId,k,occ){
  const st=D.stays.find(s=>s.id===stayId); if(!st) return;
  // the pin needs no language and no gender, so it never triggers those prompts
  if(k==='location'){
    const pin=pinFor(st);
    if(!pin){ toast('⚠️ مفيش لوكيشن مسجّل لشقة '+st.flat+' — كلّمي سارة'); return; }
    (navigator.clipboard?navigator.clipboard.writeText(pin):Promise.reject()).then(
      ()=>toast('📍 اللوكيشن اتنسخ — الصقه في واتساب'),
      ()=>{ prompt('انسخ اللوكيشن:',pin); });
    return;
  }
  if(!ensureLangGender(st)) return;
  const t=tpl(k,st,occ);
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(
    ()=>toast('📋 اتنسخت ('+(tplLang(st)==='ar'?'عربي':'EN')+') — الصقها في واتساب'),
    ()=>{ prompt('انسخ الرسالة:',t); });
}

   هو نفسه اللي بيتبعت لوحده (سارة وخالد بس — حساب داني مرفوض من السيرفر) */

function daysSince(ymd){ try{ return Math.max(0,Math.floor((new Date(D.today+'T12:00:00')-new Date(ymd+'T12:00:00'))/86400000)); }catch(e){ return 0; } }
function taskById(id){ return (D.tasks||[]).find(x=>x.id===id)||(D.tasksAll||[]).find(x=>x.id===id); }
async function editTask(id){

  const dt=prompt('التاريخ (YYYY-MM-DD):',t.date); if(dt===null) return;

  const ap=prompt('الشقة (8A / 17A / 17B / 28A / Zayed 2000 — أو فاضي):',t.apt||''); if(ap===null) return;

  if(!r||!r.ok){ toast('❌ لم يتم — '+((r&&r.error)||'حاول مرة أخرى')); return; }

/* deleting ≠ ticking (Sarah 2026-08-22): a done task stays struck-through as the day's record;
   delete is for a task that should never have existed — it leaves Emad's panel too, and the
   assignee gets the same telegram they got when it was added */
async function delTask(id){
  const t=taskById(id); if(!t) return;
  if(!confirm('حذف المهمة دي نهائيًا؟\n'+t.text)) return;
  let r=null; try{ r=await api('emad_task_delete',{id}); }catch(e){}
  if(!r||!r.ok){ toast('❌ لم يتم — '+((r&&r.error)||'حاول مرة أخرى')); return; }
  D.tasks=(D.tasks||[]).filter(x=>x.id!==id); D.tasksAll=(D.tasksAll||[]).filter(x=>x.id!==id);
  try{ localStorage.setItem(CK,JSON.stringify({D,ts:lastTs})); }catch(e){}
  renderMain(); try{ renderLog(); }catch(e){}
  toast('🗑️ اتشالت المهمة — اتشالت من عند عماد كمان');
}

/* ✏️👤 guest names (Sarah 2026-08-30): the booking name is not always who we talk to — one guest
   books and another arrives, or they are two. The override (EN + AR) feeds every card, template,
   brief and log line; the Arabic name replaces transliteration in the Arabic messages. */
async function editNames(stayId){
  const st=D.stays.find(s=>s.id===stayId); if(!st) return;
  const en=prompt('اسم الضيف بالإنجليزي — ممكن اسمين (مثال: Amina - Omar)'+(st.bookingName?'\nالحجز الأصلي باسم: '+st.bookingName:''),st.guest||''); if(en===null) return;
  const ar=prompt('الاسم بالعربي (اللي بيظهر في الرسائل العربية):',st.nameAr||''); if(ar===null) return;
  const r=await apiRetry('comms_tick',{stayId,step:'names',occ:'',val:(en.trim()+'|'+ar.trim()),tag:tagOf(st)});

/* ---- due logic (mirror of the server's watcher) ---- */
function nowHM(){ const d=new Date(); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function stepState(st, sp){
  if(sp.done) return 'done';
  const today=D.today||new Date().toISOString().slice(0,10);
  if(sp.k==='docs') return (sp.nagD&&sp.nagD<=today)?'due':'open';
  /* ANY gate, not just 'docs' (Sarah 2026-08-19: "it doesn't have a time stamp so i am not sure it
     will appear in the tasks" — she was right). A gated step carries no due DATE; being unlocked is
     what makes it due. This tested for the literal string 'docs', so the new location step — gated
     on the manual — fell through to the no-date branch and sat quietly as 'open', never reaching
     the to-do. Reading the gate itself covers the manual, the location, and whatever comes next. */
  if(sp.gated) return st.steps.some(x=>x.k===sp.gated&&x.done)?'due':'wait';
  /* ARRIVAL DAY = TODAY'S LIST (Sarah 2026-08-21, Afefy): the +2h gate used to file this under
     «خلال يومين» until two hours after arrival — today's work under a heading that says it is not
     today's. It sits in مهام النهارده from the morning; the row's own sub-line carries the timing,
     and Dani times the message himself. */
  if(sp.k==='settled') return st.ci<=today ? 'due' : 'open';
  if(!sp.dueD) return 'open';
  if(sp.dueD<=today) return 'due';
  return (sp.dueD<= (function(){const d=new Date(today+'T12:00:00'); d.setDate(d.getDate()+2); return d.toISOString().slice(0,10);})()) ? 'soon':'open';
}

function showTab(p,el){

  ['queue','stays','sched','rep','task','log'].forEach(x=>document.getElementById('p-'+x).style.display=(x===p?'block':'none'));

/* After a tick only the to-do and the stay cards can have changed — rebuilding the week grid, the
   repairs list and the log as well is what made every tap feel heavy (Sarah 2026-08-12). */
function renderMain(){ renderQueue(); renderStays(); }

/* WHEN IS THIS DUE? (Sarah 2026-08-19: "it still doesn't have a timestamp"). A gated step carries no
   due date — the gate opening IS its timing — so the sub-line came out blank and the row looked
   undated and untrustworthy, even after it started reaching the to-do. Now it says so in words: once
   the gate is ticked, the date it was ticked; before that, which step it is waiting on. */
function gateOf(st,sp){ return sp.gated ? (st.steps||[]).find(x=>x.k===sp.gated) : null; }
function gateName(k){ return STEP_AR[k]||'الخطوة اللي قبلها'; }
function dueTxt(st,sp){
  if(sp.dueD) return `تستحق ${sp.dueD}`;
  const g=gateOf(st,sp); if(!g) return '';
  if(!g.done) return `بعد ${gateName(sp.gated)}`;
  const at=String(g.doneAt||'').slice(0,10), today=D.today||'';
  if(!at) return 'مستحقة دلوقتي';
  // due since the gate opened — so it goes late the day after, exactly like a dated step
  return at<today ? `⚠️ متأخرة من ${at}` : `مستحقة من ${at}`;
}
function stepRow(st,sp,state){
  const id=`${st.id}|${sp.k}|${sp.occ}`;
  /* A long stay has SEVERAL cleans, so it has several coordination steps — with the date buried in
     the grey sub-line they read as the same row twice (Sarah 2026-08-12, Iman's 85 nights). The
     occurrence date now sits in the label itself, and the sub-line carries both dates. */
  const occLbl=(sp.occ&&sp.occ!=='mid')?` — ${String(sp.occ).slice(5).split('-').reverse().join('/')}`:'';
  const dt=dueTxt(st,sp);
  const sub=(sp.occ&&sp.occ!=='mid')
    ? `النظافة يوم ${sp.occ}${sp.projected?' (متوقعة — لسه ماتأكدتش في الجدول)':''}${dt?` · ${dt}`:''}`
    : dt;
  const tickFn=sp.k==='arrivaltime'?`tickArrival('${st.id}','${sp.occ}')`:`tick('${st.id}','${encStep(sp.k)}','${sp.occ}')`;
  // custom steps have no template to copy — their label IS the instruction; they get 🗑 instead
  const copyBtn=(sp.k==='docs'||sp.k==='security'||sp.k==='arrivaltime'||sp.custom)?'':`<button class="btn" onclick="copyTpl('${st.id}','${sp.k}','${sp.occ}')">📋 نسخ</button>`;
  const delBtn=sp.custom?`<button class="btn" onclick="delCustomStep('${st.id}','${encodeURIComponent(sp.label)}')">🗑️</button>`:'';
  /* Never let the code step look ready when the lock has not been changed (Sarah 2026-08-16). The
     message carries the code the guest is ENTITLED to; if no visit has been asked to set it, that
     code is not on the door yet and sending it strands the guest outside. */
  const codeWarn=(sp.k==='code'&&!sp.done&&!codeIsSet(st))
    ? `<div class="step-sub" style="color:#cc5f5f;font-weight:800">⚠️ الكود ${codeFor(st)} لسه محدش غيّره على الباب — اتأكد مع عماد قبل ما تبعته</div>` : '';
  return `<div class="step ${sp.done?'done':''}">
    <div class="step-lb">${sp.label}${occLbl}${sp.k==='arrivaltime'&&sp.val?` — <b>${sp.val}</b>`:''}<div class="step-sub">${sp.done?('تم '+String(sp.doneAt||'').slice(0,10)+(sp.by?' — '+sp.by:'')):sub}</div>${codeWarn}</div>
    ${state==='wait'?`<span class="badge b-soon">بعد ${gateName(sp.gated)}</span>`:''}
    ${sp.done?`<button class="btn" onclick="untick('${st.id}','${encStep(sp.k)}','${sp.occ}')">↩</button>`:delBtn+copyBtn+`<button class="btn btn-ok" id="t-${id}" onclick="${tickFn}">✅</button>`}
  </div>`;
}

/* ---- handover · WhatsApp group · language · requests · notes (the handover ledger) ---- */
function metaChips(st){
  const g=`👨‍👩‍👧 ${st.adults||0}${st.children?'+'+st.children+'ط':''}${st.infants?'+'+st.infants+'ر':''}`;

}
function stayExtra(st){
  const ho=st.handover||{}, gr=st.group||{};
  let h='<div class="step" style="border-top:1px solid var(--border)">';
  h+=`<div class="step-lb">🤝 التسليم لداني<div class="step-sub">${ho.done?('اتسلّم '+ho.at+(ho.by?' — '+ho.by:'')):'الضيف لسه مع سارة/خالد (Airbnb / محادثة خاصة)'}</div></div>`;
  /* ↩ تراجع — لازم يكون ممكن نلغي علامة اتحطت بالغلط (أو من الـbackfill) لحد ما الحاجة
     تتعمل فعلاً (Sarah 2026-08-11) */
  h+=ho.done?`<span class="badge b-ok">مع داني</span><button class="btn" onclick="undoFlag('${st.id}','handover')">↩</button>`
            :`<button class="btn btn-ok" onclick="doHandover('${st.id}')">🤝 تسليم</button>`;
  h+='</div><div class="step">';
  h+=`<div class="step-lb">💬 جروب الواتساب (بداني جواه)<div class="step-sub">${gr.done?('جاهز '+gr.at+(gr.by?' — '+gr.by:'')):(gr.invited?'الدعوة اتبعتت — مستنيين الضيف ينضم':'لسه ماتعملش — على سارة/خالد')}</div></div>`;
  h+=gr.done?`<span class="badge b-ok">✓</span><button class="btn" onclick="undoFlag('${st.id}','group')">↩</button>`
    :(`<button class="btn" onclick="copyTpl('${st.id}','groupintro','')">📋 رسالة التعريف</button>`+(gr.invited?"":`<button class="btn" onclick="tickGroupVal('${st.id}','invited')">📩 بعت دعوة</button>`)+`<button class="btn btn-ok" onclick="tickGroupVal('${st.id}','')">✅ جاهز</button>`);
  /* the text gets the FULL row and the buttons live underneath — five buttons beside the text was
     squishing طلبات into a one-word column (Sarah 2026-08-30) */
  h+='</div><div class="step" style="flex-direction:column;align-items:stretch">';
  h+=`<div class="step-lb">🌐 لغة التواصل — <b>${st.lang||'؟'}</b> · 📌 طلبات — <b>${st.requests||'—'}</b></div>
      <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap">
        <button class="btn" onclick="setGender('${st.id}')">⚥</button><button class="btn" onclick="setField('${st.id}','lang')">🌐</button><button class="btn" onclick="setField('${st.id}','requests')">📌</button>
        <button class="btn" onclick="editNames('${st.id}')" title="اسم الضيف (إنجليزي + عربي)">✏️👤</button>
        <button class="btn" onclick="addCustomStep('${st.id}')" title="إضافة خطوة للسلم">➕📨</button>
      </div>`;
  h+='</div>';
  h+=`<div class="step" style="flex-direction:column;align-items:stretch">
    <div style="display:flex;align-items:center"><div class="step-lb">📝 ملاحظات (اللي اتقال على Airbnb أو في الخاص)</div>
    <button class="btn" onclick="addNote('${st.id}')">➕</button></div>`;
  /* الملاحظات (اللي اتقال على Airbnb) لازم تبان زي 📌 الطلبات الخاصة — غامق وأسود، مش رمادي
     صغير يعدي من غير ما حد ياخد باله (سارة 2026-08-12) */
  (st.notes||[]).slice().reverse().forEach(n=>{ h+=`<div style="padding:4px 0;border-top:1px dashed var(--border);font-size:12.5px;font-weight:800;color:var(--text1)">${n.text}
    <span style="font-weight:400;font-size:10.5px;color:var(--text3)">— ${n.by} ${n.at}</span></div>`; });
  h+='</div>';
  return h;
}
/* PERF (Sarah 2026-08-10): no full reloads after a tick — the server gets the guest label from
   us, we mutate our own copy, and the background refresh reconciles later. */
function tagOf(st){ return `${st.guest} (${st.flat})`; }
async function pseudoTick(stayId, step, val, msg, snap){
  const st=D.stays.find(s=>s.id===stayId);
  const r=await apiRetry('comms_tick',{stayId,step,occ:'',val:val||'',tag:st?tagOf(st):'',snap:snap||''});
  if(!r||r.ok!==true){ toast('❌ لم يُحفظ — حاول مرة أخرى'); return false; }
  if(st){
    const now=new Date().toISOString().slice(0,10);
    if(step==='handover') st.handover={done:true,by:currentUserName,at:now,note:val||''};
    else if(step==='group') st.group={done:val!=='invited',by:currentUserName,at:now,invited:val==='invited'};
    else if(step==='lang') st.lang=val||'';
    else if(step==='requests') st.requests=val||'';
    else if(step==='gender') st.gender=val||'';
    try{ localStorage.setItem(CK,JSON.stringify({D,ts:lastTs})); }catch(e){}
    renderMain();
  }
  toast(msg||'✅ اتسجلت'); return true;
}
function doHandover(stayId){
  const st=D.stays.find(s=>s.id===stayId); if(!st) return;
  const note=prompt('🤝 تسليم الضيف لداني\nاكتب إيه اللي حصل معاه لحد دلوقتي (على Airbnb أو في الخاص) — أسئلة، اتفاقات، أي حاجة تهم داني:','');
  if(note===null) return;
  // the snapshot is built HERE from what we're looking at — the server sends it verbatim
  const doneL=st.steps.filter(x=>x.done).map(x=>'✅ '+x.label+(x.by?' ('+x.by+')':''));
  const next=st.steps.filter(x=>!x.done&&x.k!=='docs');
  const snap=`${st.ci} ← ${st.co}`+(st.lang?`\n🌐 اللغة: ${st.lang}`:'')+
    `\n👨‍👩‍👧 ${st.adults||0} كبار`+(st.children?` + ${st.children} أطفال`:'')+(st.infants?` + ${st.infants} رضّع`:'')+
    (st.requests?`\n📌 طلبات خاصة: ${st.requests}`:'')+
    ((st.notes&&st.notes.length)?`\n📝 ملاحظات سابقة:\n`+st.notes.map(n=>'• '+n.text).join('\n'):'')+
    `\n\nاللي اتعمل قبل التسليم:\n`+(doneL.length?doneL.join('\n'):'— لسه مفيش')+
    (next.length?`\n\nأول خطوة عليك: ${next[0].label}`:'');
  pseudoTick(stayId,'handover',note,'🤝 اتسلّم لداني — التلجرام فيه كل التفاصيل',snap);
}
function tickGroupVal(stayId,val){ pseudoTick(stayId,'group',val,val==='invited'?'📩 اتسجلت الدعوة':'💬 الجروب جاهز'); }
/* ↩ إلغاء علامة التسليم أو الجروب — بيرجّع الضيف للستة سارة/خالد لحد ما تتعمل فعلاً */
async function undoFlag(stayId,step){
  const st=D.stays.find(s=>s.id===stayId); if(!st) return;

/* ---- ticks: save-then-toast, nothing local moves until the server accepts ---- */
/* NOTHING IS SHOWN AS DONE BEFORE THE SHEET ACCEPTED IT (Sarah's standing rule, restated
   2026-08-12: optimistic ticks "showed errors in previous versions"). So the speed has to come
   from the server, not from pretending — see commsTick and the session cache. The button shows
   ⏳ while it waits so the screen never looks frozen. */
/* custom-step keys ('cx:'+label) ride onclick attributes URI-encoded so free-text labels can't
   break the markup; standard keys pass through both functions unchanged */
function encStep(k){ return String(k).indexOf('cx:')===0?encodeURIComponent(k):k; }
async function tick(stayId,k,occ){
  k=decodeURIComponent(k);
  const btn=document.getElementById(`t-${stayId}|${k}|${occ}`); if(btn){ btn.disabled=true; btn.textContent='⏳'; }
  const st=D.stays.find(x=>x.id===stayId);
  const r=await apiRetry('comms_tick',{stayId,step:k,occ,tag:st?tagOf(st):''});
  if(btn){ btn.disabled=false; btn.textContent='✅'; }
  if(!r||r.ok!==true){ toast('❌ لم يُحفظ — حاول مرة أخرى'); return; }
  applyTick(stayId,k,occ,true,'');
  toast('✅ اتسجلت');
}
async function tickArrival(stayId,occ){
  const v=prompt('ميعاد وصول الضيف (مثال 16:30):','15:00');
  if(v===null) return;
  const t=String(v).trim();
  if(!/^\d{1,2}:\d{2}$/.test(t)){ toast('اكتب الوقت بصيغة HH:MM'); return; }
  const r=await apiRetry('comms_tick',{stayId,step:'arrivaltime',occ,val:t,tag:(function(){const s=D.stays.find(x=>x.id===stayId);return s?tagOf(s):''})()});
  if(!r||r.ok!==true){ toast('❌ لم يُحفظ — حاول مرة أخرى'); return; }
  applyTick(stayId,'arrivaltime',occ,true,t);
  toast('✅ الوصول '+t);
}
async function untick(stayId,k,occ){
  k=decodeURIComponent(k);
  if(!confirm('إلغاء العلامة؟')) return;
  const st=D.stays.find(x=>x.id===stayId);
  const r=await apiRetry('comms_tick',{stayId,step:k,occ,undo:true,tag:st?tagOf(st):''});
  if(!r||r.ok!==true){ toast('❌ لم يتم — حاول مرة أخرى'); return; }
  applyTick(stayId,k,occ,false,'');
  toast('↩ اتلغت');
}
function applyTick(stayId,k,occ,done,val){
  const st=D.stays.find(s=>s.id===stayId); if(!st) return;
  const sp=st.steps.find(x=>x.k===k&&String(x.occ)===String(occ)); if(!sp) return;
  sp.done=done; sp.doneAt=done?new Date().toISOString():''; if(k==='arrivaltime'){ sp.val=done?val:''; st.arrivalTime=done?val:''; }
  try{ localStorage.setItem(CK,JSON.stringify({D,ts:lastTs})); }catch(e){}
  renderMain();
}


/* THE GREETING FOLLOWS THE CLOCK AT COPY TIME (Sarah 2026-08-20) — a message copied at 9am says
   صباح الخير / Good morning, one copied at 9pm says مساء الخير / Good evening. Noon is the line. */
function greetEN(){ return new Date().getHours()<12 ? 'Good morning' : 'Good evening'; }
function greetAR(){ return new Date().getHours()<12 ? 'صباح الخير' : 'مساء الخير'; }
/* THE GUEST'S NAME IN ARABIC LETTERS inside Arabic messages (Sarah 2026-08-20) — «صباح الخير
   Mohamed» reads broken and bidi-scrambles; «صباح الخير محمد» reads like a person wrote it.
   A dictionary carries the names that actually pass through these flats (exactness matters —
   محمد not موهاميد); a rough transliterator catches the rest; a name already in Arabic passes
   through untouched. */
const AR_NAMES={mohamed:'محمد',mohammed:'محمد',muhammad:'محمد',mohammad:'محمد',ahmed:'أحمد',ahmad:'أحمد',
mahmoud:'محمود',mostafa:'مصطفى',mustafa:'مصطفى',omar:'عمر',umar:'عمر',ali:'علي',hassan:'حسن',hussein:'حسين',
hussain:'حسين',khaled:'خالد',khalid:'خالد',ibrahim:'إبراهيم',ebrahim:'إبراهيم',youssef:'يوسف',yousef:'يوسف',
yusuf:'يوسف',abdallah:'عبدالله',abdullah:'عبدالله',amr:'عمرو',tarek:'طارق',tariq:'طارق',karim:'كريم',
kareem:'كريم',sherif:'شريف',sharif:'شريف',waleed:'وليد',walid:'وليد',fahad:'فهد',fahd:'فهد',saad:'سعد',
salem:'سالم',salim:'سالم',sami:'سامي',samir:'سمير',nader:'نادر',hany:'هاني',hani:'هاني',ramy:'رامي',
rami:'رامي',amir:'أمير',ameer:'أمير',amjed:'أمجد',amjad:'أمجد',habib:'حبيب',arslan:'أرسلان',salah:'صلاح',
saleh:'صالح',ehab:'إيهاب',emad:'عماد',sarah:'سارة',sara:'سارة',mona:'منى',muna:'منى',iman:'إيمان',
eman:'إيمان',fatma:'فاطمة',fatima:'فاطمة',aya:'آية',nour:'نور',noor:'نور',hala:'هالة',dina:'دينا',
rana:'رنا',salma:'سلمى',laila:'ليلى',layla:'ليلى',mariam:'مريم',maryam:'مريم',heba:'هبة',amira:'أميرة',
fadia:'فادية',annalise:'أناليز',olivia:'أوليفيا',donovan:'دونوفان',reeve:'ريف',ryen:'رين'};
function arTranslit(s){
  s=String(s).toLowerCase().replace(/[^a-z]/g,''); if(!s) return '';
  s=s.replace(/e$/,'');                                            // silent final e: Reeve → ريف
  const digs=[['sh','ش'],['ch','تش'],['kh','خ'],['gh','غ'],['th','ث'],['dh','ذ'],['ph','ف'],
              ['aa','ا'],['ee','ي'],['oo','و'],['ou','و'],['ai','اي'],['ay','اي'],['ei','ي'],['ey','ي']];
  const map={a:'ا',b:'ب',c:'ك',d:'د',e:'ي',f:'ف',g:'ج',h:'ه',i:'ي',j:'ج',k:'ك',l:'ل',m:'م',n:'ن',
             o:'و',p:'ب',q:'ق',r:'ر',s:'س',t:'ت',u:'و',v:'ف',w:'و',x:'كس',y:'ي',z:'ز'};
  let out='',i=0;
  while(i<s.length){
    let hit=null;
    for(const d of digs){ if(s.startsWith(d[0],i)){ hit=d[1]; i+=d[0].length; break; } }
    if(hit===null){
      const c=s[i];
      if(i===0&&'aeiou'.includes(c)) hit=(c==='a')?'أ':(c==='o'||c==='u')?'أو':'إ';
      else hit=map[c]||'';
      i++; if(s[i]===c) i++;                                       // doubles collapse: Salah's ll, mm…
    }
    out+=hit;
  }
  return out;
}
function arFirst(g){
  const n=firstName(g);
  if(n==='there') return '';                                       // no name on the booking
  if(/[؀-ۿ]/.test(n)) return n;                          // already Arabic — untouched
  return AR_NAMES[n.toLowerCase().replace(/[^a-z]/g,'')]||arTranslit(n)||n;
}
/* ==== FINAL TEMPLATES (Sarah's revision 2026-08-10). Function declarations override the
   earlier versions above. G() picks the gendered Arabic form from the stay's gender setting
   ('f' = lady, 'g' = group, default man). Latin text is kept out of Arabic sentences so
   WhatsApp's bidi never scrambles them; the door code sits on its own line. ==== */

    // 📍 no wording — copyTpl hands over the pin itself; this keeps tpl() honest if anything asks

    case 'arrival': case 'arrivalask': return `${greetAR()} ${n}! نجهّز البيت لإقامتك — متوقع ${G('تصل','تصلي','تصلوا')} الساعة كم؟ حتى يكون كل شيء جاهزاً قبل الوصول.`;

${codeFor(st)}

✅ ${G('أخبرنا','أخبرينا','أخبرونا')} بمجرد المغادرة

/* ==== 14c continuation (overrides): to-do home · سجل log · week-grid schedule ==== */
const STEP_AR={welcome:'الترحيب',docs:'المستندات',manual:'دليل البيت',location:'لوكيشن الشقة',code:'كود الباب',arrival:'ميعاد الوصول',security:'مستندات الأمن',settled:'الاطمئنان',midstay:'تنسيق النظافة',checkout:'تعليمات المغادرة',review:'طلب التقييم'};

async function toggleTask(id,done){
  const r=await apiRetry('emad_task_toggle',{id,done});   // same stall protection as ticks — the write is idempotent
  if(!r||!r.ok){ toast('❌ لم يتم — حاول مرة أخرى'); return; }
  [(D.tasks||[]).find(x=>x.id===id),(D.tasksAll||[]).find(x=>x.id===id)].forEach(x=>{ if(x) x.done=done; });
  try{ localStorage.setItem(CK,JSON.stringify({D,ts:lastTs})); }catch(e){}
  renderMain(); try{ renderLog(); }catch(e){}
  toast(done?'✅ تمت':'↩ رجعت');
}

/* الرئيسية — مهام النهارده أولاً (زي شاشة عماد): تعلّم ✅ لما تخلص */
function renderQueue(){
  const el=document.getElementById('p-queue'); if(!el) return;
  const today=D.today||'';
  let due=[], soon=[];
  /* HANDOVER DECIDES WHOSE LIST A STEP JOINS — it never deletes the step (Sarah 2026-08-12).
     Not every guest goes to Dani; the ones we keep are still worked through the same ladder, so
     Sarah and Khaled get those rows in their OWN section, with the same copy/tick trail. Dani
     simply never sees a guest that was not handed to him. */
  let dueOwn=[], soonOwn2=[];
  D.stays.forEach(st=>{
    const handed=!!(st.handover&&st.handover.done);
    if(!handed && currentUser==='malah') return;
    st.steps.forEach(sp=>{
      const s=stepState(st,sp);
      if(s!=='due'&&s!=='soon') return;
      if(handed){ if(s==='due') due.push({st,sp}); else soon.push({st,sp}); }
      else      { if(s==='due') dueOwn.push({st,sp}); else soonOwn2.push({st,sp}); }
    });
  });
  /* one row, drawn the same way everywhere on this screen — tickbox, text, buttons */
  const trow=(tick,tx,btns,done)=>`<div class="trow${done?' is-done':''}">
      <span class="tk">${tick}</span><span class="tx">${tx}</span>${btns||''}</div>`;
  // every row in the to-do says when it fell due — a gated step included (see dueTxt)
  const stepTx=x=>`<b>${x.sp.label}</b> — <bdi>${x.st.guest}</bdi>
      <div class="sub">${x.st.flat}${x.sp.occ&&x.sp.occ!=='mid'?' · '+x.sp.occ:''}${(t=>t?' · '+t:'')(dueTxt(x.st,x.sp))}</div>`;
  const stepBtns=x=>`${x.st.phone?`<a class="wa" target="_blank" href="https://wa.me/${String(x.st.phone).replace(/[^0-9]/g,'')}">💬</a>`:''}
      ${(x.sp.k==='docs'||x.sp.k==='security'||x.sp.k==='arrivaltime')?'':`<button class="btn" onclick="copyTpl('${x.st.id}','${x.sp.k}','${x.sp.occ}')">📋</button>`}
      <button class="btn btn-ok" onclick="${x.sp.k==='arrivaltime'?`tickArrival('${x.st.id}','${x.sp.occ}')`:`tick('${x.st.id}','${x.sp.k}','${x.sp.occ}')`}">✅</button>`;
  const nDone=(D.tasks||[]).filter(t=>t.done).length;
  let h=`<div class="sec-h">✅ مهام النهارده <span class="n">(${(D.tasks||[]).filter(t=>!t.done).length+due.length}${nDone?` · ${nDone} خلصت`:''})</span></div><div class="home-card">`;
  (D.tasks||[]).forEach(t=>{
    const age=t.addedAt?daysSince(t.addedAt):0;
    h+=trow(t.done?'✅':'⬜',
      `${t.time?`<span class="tm">${t.time}</span> · `:''}${t.text}${t.overdue&&!t.done?` <span class="late">(متأخرة)</span>`:''}
       <div class="sub">${age>0?`⏳ من ${age} يوم`:'مضافة النهارده'}${t.by?` — <span class="nm">${t.by}</span>`:''}</div>`,
      `<button class="btn" onclick="editTask('${t.id}')">✏️</button>
       <button class="btn" onclick="delTask('${t.id}')">🗑️</button>
       ${t.done?`<button class="btn" onclick="toggleTask('${t.id}',false)">↩</button>`:`<button class="btn btn-ok" onclick="toggleTask('${t.id}',true)">✅</button>`}`,
      t.done);
  });
  h+=due.length?due.map(x=>trow('⬜',stepTx(x),stepBtns(x),false)).join('')
    :((D.tasks||[]).length?'':`<div class="trow"><span class="tk">✨</span><span class="tx" style="color:var(--ok)">لا يوجد شيء مستحق الآن</span></div>`);
  /* WHAT WAS TICKED TODAY STAYS ON SCREEN, struck through (Sarah 2026-08-18: "whatever is done is
     marked done and striken through not vanishing"). A step used to leave the list the instant it
     was ticked, so the day's work erased itself as it was done — nothing to check against, and no
     way back if it was ticked by mistake. */
  const doneToday=[];
  D.stays.forEach(st=>{
    if(currentUser==='malah' && !(st.handover&&st.handover.done)) return;
    st.steps.forEach(sp=>{ if(sp.done && String(sp.doneAt||'').slice(0,10)===today) doneToday.push({st,sp}); });
  });
  doneToday.forEach(x=>{ h+=trow('✅',stepTx(x),
    `<button class="btn" onclick="untick('${x.st.id}','${x.sp.k}','${x.sp.occ}')">↩</button>`,true); });
  h+='</div>';
  /* الجروبات والتسليم شغل سارة/خالد — مش بيظهر لداني، وبيصحى قبل الوصول بأسبوع بس
     (حجز بعيد ميقعدش في اللستة شهور — Sarah 2026-08-11) */
  const wk7=(function(){const d=new Date(today+'T12:00:00');d.setDate(d.getDate()+7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
  /* بيشمل كمان الضيوف اللي ساكنين دلوقتي (وصلوا قبل النهارده) — دول كانوا بيسقطوا من اللستة
     خالص، وهما بالظبط اللي لسه ماتسلموش (Sarah 2026-08-11) */
  const pend=D.stays.filter(st=>
    ((st.ci>=today&&st.ci<=wk7)||(st.ci<=today&&st.co>today))&&
    (!(st.handover&&st.handover.done)||!(st.group&&st.group.done)));
  if(pend.length){
    // Dani sees the same list read-only — it is what is coming to him, not work he can start
    h+=`<div class="sec-h">${currentUser==='malah'
      ? `🤝 جاي قدامك — لسه ماتسلمش <span class="n">(${pend.length})</span>`
      : `🤝 تسليم وجروبات — <span class="who">خالد وسارة</span> <span class="n">(${pend.length})</span>`}</div><div class="home-card">`;
    pend.forEach(st=>{
      const bits=[];
      if(!(st.group&&st.group.done)) bits.push(st.group&&st.group.invited?'📩 دعوة اتبعتت — مستنيين الانضمام':'💬 الجروب لسه ماتعملش');
      if(!(st.handover&&st.handover.done)) bits.push('🤝 لسه ماتسلمش لداني');
      const own=currentUser!=='malah';   // only Sarah/Khaled can act here
      h+=trow('🤝',`<b><bdi>${st.guest}</bdi></b> — ${st.flat}<div class="sub">وصول ${st.ci} · ${bits.join(' · ')}</div>`,
        `${(own&&!(st.group&&st.group.done))?`<button class="btn" onclick="copyTpl('${st.id}','groupintro','')">📋</button><button class="btn" onclick="tickGroupVal('${st.id}','')">💬 جاهز</button>`:''}
         ${(own&&!(st.handover&&st.handover.done))?`<button class="btn btn-ok" onclick="doHandover('${st.id}')">🤝</button>`:''}`,false);
    });
    h+='</div>';
  }
  /* OUR OWN GUESTS' LADDER — the ones we did not hand over. Same steps, same copy button, same
     tick, so the trail exists whoever does the work (Sarah 2026-08-12). Dani never sees it. */
  if(currentUser!=='malah'){
    h+=`<div class="sec-h">📋 خطوات ضيوف عندنا — <span class="who">خالد وسارة</span> <span class="n">(${dueOwn.length})</span></div><div class="home-card">`;
    if(dueOwn.length) h+=dueOwn.map(x=>trow('⬜',stepTx(x),stepBtns(x),false)).join('');
    else h+=`<div class="trow"><span class="tk">✨</span><span class="tx sub">مفيش خطوات مستحقة على ضيوف لسه ماتسلمتش</span></div>`;
    h+='</div>';
  }
  /* BOTH 48h SECTIONS STAY ON SCREEN (Sarah 2026-08-12: "this is not appearing now"). They used to
     disappear when empty, which reads as a bug rather than "nothing due" — and Dani's is empty
     precisely when nobody has been handed to him, which is worth SAYING, not hiding. */
  h+=`<div class="sec-h">🟡 خلال يومين — 📨 <span class="who">داني</span> <span class="n">(${soon.length})</span></div><div class="home-card">`;
  if(soon.length)
    h+=soon.map(x=>trow('🕒',`${x.sp.label} — <bdi>${x.st.guest}</bdi><div class="sub">${x.st.flat} · ${x.sp.dueD||''}</div>`,'',false)).join('');
  else {
    const waiting=D.stays.filter(st=>!(st.handover&&st.handover.done)&&st.co>today).length;
    h+=`<div class="trow"><span class="tk">—</span><span class="tx sub">مفيش${waiting?` · فيه ${waiting} ضيف لسه ماتسلمش، خطواتهم مش هتظهر هنا غير بعد التسليم`:''}</span></div>`;
  }
  h+='</div>';
  /* الجزء التاني من «خلال يومين» — شغل سارة وخالد: ضيف واصل خلال يومين ولسه محتاج جروب أو
     تسليم. مفصول ومعنون علشان كل واحد يعرف اللي عليه (Sarah 2026-08-12). */
  const d2=(function(){const d=new Date(today+'T12:00:00');d.setDate(d.getDate()+2);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
  const soonOwn=pend.filter(st=>st.ci>=today&&st.ci<=d2);
  h+=`<div class="sec-h">🟡 خلال يومين — 🤝 <span class="who">سارة وخالد</span> <span class="n">(${soonOwn.length+soonOwn2.length})</span></div><div class="home-card">`;
  if(soonOwn.length){
    soonOwn.forEach(st=>{
      const need=[];
      if(!(st.group&&st.group.done)) need.push('💬 الجروب');
      if(!(st.handover&&st.handover.done)) need.push('🤝 التسليم');
      h+=trow('🕒',`${need.join(' + ')} — <bdi>${st.guest}</bdi><div class="sub">${st.flat} · وصول ${st.ci}</div>`,
        currentUser!=='malah'?`<button class="btn btn-ok" onclick="doHandover('${st.id}')">🤝</button>`:'',false);
    });
  }
  // …plus the ladder steps coming due on the guests we kept, so nothing sneaks up on us either
  if(soonOwn2.length) h+=soonOwn2.map(x=>trow('🕒',`${x.sp.label} — <bdi>${x.st.guest}</bdi><div class="sub">${x.st.flat} · ${x.sp.dueD||''}</div>`,'',false)).join('');
  if(!soonOwn.length && !soonOwn2.length)
    h+=`<div class="trow"><span class="tk">—</span><span class="tx sub">مفيش حاجة علينا خلال يومين</span></div>`;
  h+='</div>';
  el.innerHTML=h;
}

/* الجدول — شبكة الأسبوع: الشقق صفوف والأيام أعمدة، نظافة + صيانة + دخول/خروج الضيوف */
let schedOff=0;
function schedShift(n){ schedOff+=n; renderSched(); }
function renderSched(){
  const el=document.getElementById('p-sched'); if(!el) return;
  const TYPE={checkout:'تنظيف خروج',midstay:'نظافة',weekly:'نظافة',revision:'إعادة',codechange:'تغيير كود',custom:'إضافي'};
  const base=new Date(); base.setDate(base.getDate()+schedOff*7);
  const dow=(base.getDay()+2)%7;                       // week starts FRIDAY (Sarah 2026-08-13)
  const start=new Date(base); start.setDate(base.getDate()-dow);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(start); d.setDate(start.getDate()+i);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');});
  const flats=[...new Set([...(D.schedule||[]).map(c=>c.flat),...D.stays.map(s=>s.flat),...(D.repairs||[]).map(r=>r.flat||r.apt)])].filter(Boolean).sort();
  const cell={};
  (D.schedule||[]).forEach(c=>{ if(days.indexOf(c.date)>-1)
    (cell[c.flat+'|'+c.date]=cell[c.flat+'|'+c.date]||[]).push(`<div style="background:#f5d9d9;border-radius:5px;padding:1px 4px;margin:1px 0">${TYPE[c.type]||c.type}${c.time&&/^\d/.test(String(c.time))?' '+c.time:''}${c.code?'<br>🔑 '+c.code:''}</div>`); });
  (D.repairs||[]).forEach(r=>{ const f=r.flat||r.apt, d=String(r.date||'').slice(0,10); if(f&&days.indexOf(d)>-1)
    (cell[f+'|'+d]=cell[f+'|'+d]||[]).push(`<div style="background:#ece0cf;border-radius:5px;padding:1px 4px;margin:1px 0">🔧 ${r.trade||''}</div>`); });
  D.stays.forEach(s=>{
    // the time the guest gave reads as a time, not as a number stuck to a name (Sarah 2026-08-18)
    if(days.indexOf(s.ci)>-1)(cell[s.flat+'|'+s.ci]=cell[s.flat+'|'+s.ci]||[]).push(`<div style="color:var(--ok);font-weight:900">▶ <bdi>${firstName(s.guest)}</bdi>${s.arrivalTime?` <span style="white-space:nowrap">🕒 ${s.arrivalTime}</span>`:''}</div>`);
    if(days.indexOf(s.co)>-1)(cell[s.flat+'|'+s.co]=cell[s.flat+'|'+s.co]||[]).push(`<div style="color:var(--danger);font-weight:900">◀ <bdi>${firstName(s.guest)}</bdi></div>`);
  });
  const DN=['الجمعة','السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس'];
  let h=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    <button class="btn" onclick="schedShift(1)">‹</button>
    <div style="flex:1;text-align:center;font-weight:900;font-size:12.5px">${days[0]} ← ${days[6]}${schedOff===0?' (الأسبوع الحالي)':''}</div>
    <button class="btn" onclick="schedShift(-1)">›</button></div>
    <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;min-width:560px;font-size:10px">
    <tr><th style="border:1px solid var(--border);background:var(--card);padding:3px;position:sticky;right:0">الشقة</th>${days.map((d,i)=>`<th style="border:1px solid var(--border);padding:3px;background:${d===D.today?'rgba(204,95,95,.12)':'var(--card)'}">${DN[i]}<br>${d.slice(5)}</th>`).join('')}</tr>`;
  flats.forEach(f=>{
    h+=`<tr><td style="border:1px solid var(--border);font-weight:900;padding:3px;background:var(--card);position:sticky;right:0;white-space:nowrap">${f}</td>`;
    days.forEach(d=>{ h+=`<td style="border:1px solid var(--border);padding:2px;vertical-align:top;min-width:72px;${d===D.today?'background:rgba(204,95,95,.05)':''}">${(cell[f+'|'+d]||[]).join('')}</td>`; });
    h+='</tr>';
  });
  h+='</table></div><div class="step-sub" style="margin-top:6px">▶ وصول · ◀ مغادرة · 🔑 كود الباب · وردي = نظافة · بيج = صيانة</div>';
  el.innerHTML=h;
}

/* السجل — كل اللي اتعلّم، لكل ضيف بالتاريخ والساعة */
function renderLog(){
  const el=document.getElementById('p-log'); if(!el) return;
  /* the FULL task book, future included (Sarah 2026-08-30): every task — Emad's and Dani's, done
     and coming — viewable, editable, deletable from here; the flat badge shows the assignment */
  let th='<div class="sec-h">📝 كل المهام <span class="n">(شامل المستقبل — اضغط ✏️ للتعديل)</span></div>';
  /* SAME GRAMMAR AS THE LOG BELOW (Sarah 2026-08-31: "the newest is on top… same formatting and
     colors like the lower part") — day headers, newest day first, log-style lines; the text keeps
     flex:1 and rows wrap so nothing squishes */
  if(D.tasksAll&&D.tasksAll.length){
    const tByDay={};
    D.tasksAll.forEach(t=>{ (tByDay[t.date]=tByDay[t.date]||[]).push(t); });
    th+=Object.keys(tByDay).sort().reverse().map(d=>
      `<div class="day-h">${d}${d===D.today?' — النهارده':(d>(D.today||'')?' — قادم':'')}</div>`+
      tByDay[d].sort((a,b)=>String(a.time||'99:99')<String(b.time||'99:99')?-1:1).map(t=>`<div class="line" style="flex-wrap:wrap;${t.done?'opacity:.55':''}">
        <span>${t.done?'✅':(t.date>(D.today||'')?'📅':'⬜')}</span>
        <span style="flex:1;min-width:55%;${t.done?'text-decoration:line-through':''}">${t.time?`<b>${t.time}</b> · `:''}${t.text}</span>
        ${t.apt?`<span class="badge b-soon">${t.apt==='Home'?'البيت':t.apt}</span>`:''}
        <span class="badge">${t.assignee==='malah'?'داني':'عماد'}</span>
        <button class="btn" onclick="editTask('${t.id}')">✏️</button>
        <button class="btn" onclick="delTask('${t.id}')">🗑️</button>
        ${t.done?`<button class="btn" onclick="toggleTask('${t.id}',false)">↩</button>`:`<button class="btn btn-ok" onclick="toggleTask('${t.id}',true)">✅</button>`}
      </div>`).join('')).join('');
  } else th+='<div class="card">لا مهام مسجلة</div>';
  th+='<div class="sec-h" style="margin-top:14px">📜 سجل التواصل</div>';
  const byDay={};
  (D.log||[]).forEach(e=>{ const d=String(e.at).slice(0,10); (byDay[d]=byDay[d]||[]).push(e); });
  const days=Object.keys(byDay).sort().reverse();
  el.innerHTML=th+(days.length?days.map(d=>`<div class="day-h">${d}${d===D.today?' — النهارده':''}</div>`+byDay[d].map(e=>{
    const lbl=e.step==='note'?('📝 '+e.val):e.step==='handover'?'🤝 تسليم لداني':e.step==='group'?(e.val==='invited'?'📩 دعوة الجروب':'💬 الجروب جاهز'):e.step==='lang'?('🌐 '+e.val):e.step==='requests'?('📌 '+e.val):e.step==='gender'?'⚥ نوع الضيف':((STEP_AR[e.step]||String(e.step).replace(/^cx:/,''))+(e.done?' ✅':' ↩'));
    return `<div class="line"><span style="flex:1">${lbl} — <bdi>${e.stay}</bdi></span><span class="step-sub" style="white-space:nowrap">${e.by||''} · ${(function(){try{return new Date(e.at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}catch(_){return ''}})()}</span></div>`;
  }).join('')).join(''):'<div class="card">لا نشاط مسجّل بعد</div>');
}


/* ==== 14c final pass: week grid = Hub week.html grammar · repairs = Hub data + fields ==== */

/* الجدول — نفس شبكة الهاب: إقامات خضراء ممتدة، نظافة وردية بكود وخروج/دخول، صيانة بيج */
function renderSched(){
  const el=document.getElementById('p-sched'); if(!el) return;
  const base=new Date(); base.setDate(base.getDate()+schedOff*7);
  const dow=(base.getDay()+2)%7;                       // week starts FRIDAY (Sarah 2026-08-13)
  const start=new Date(base); start.setDate(base.getDate()-dow);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(start); d.setDate(start.getDate()+i);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');});
  const DN=['الجمعة','السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس'];
  const flats=[...new Set([...(D.schedule||[]).map(c=>c.flat),...D.stays.map(s=>s.flat),...(D.rep&&D.rep.open?D.rep.open.map(r=>r.flat):[])])].filter(Boolean).sort();
  const C={line:'#ecdede',occ:'#e4efe1',occ2:'#d4e7cf',clean:'#f5dede',mid:'#d6e2f2',rev:'#ecdcf0',rep:'#ece0cf'};
  const short=g=>String(g||'').trim().split(/\s+/)[0];
  const cleansAt=(f,d)=>(D.schedule||[]).filter(c=>c.flat===f&&c.date===d);
  const repAt=(f,d)=>((D.rep&&D.rep.open)||D.repairs||[]).find(r=>(r.flat||r.apt)===f&&String(r.date||'').slice(0,10)===d);
  const stayIn=(f,d)=>D.stays.find(s=>s.flat===f&&s.ci===d);
  const stayOut=(f,d)=>D.stays.find(s=>s.flat===f&&s.co===d);
  const covering=(f,d)=>D.stays.find(s=>s.flat===f&&s.ci<d&&s.co>d);
  let h=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
    <button class="btn" onclick="schedShift(1)">‹</button>
    <div style="flex:1;text-align:center;font-weight:900;font-size:12.5px">${days[0]} ← ${days[6]}${schedOff===0?' (الأسبوع الحالي)':''}</div>
    <button class="btn" onclick="schedShift(-1)">›</button></div>
    <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;min-width:640px;table-layout:fixed;font-size:10.5px">
    <tr><th style="border:1px solid ${C.line};background:#fff;padding:2px;width:58px"></th>${days.map((d,i)=>`<th style="border:1px solid ${C.line};padding:2px;font-size:9.5px;background:#fff;${d===D.today?'color:var(--primary);font-weight:900':'color:var(--text2)'}">${DN[i]}<br>${d.slice(5)}</th>`).join('')}</tr>`;
  flats.forEach(f=>{
    h+=`<tr><td style="border:1px solid ${C.line};font-weight:700;padding:2px 3px;background:#fff;font-size:11px;white-space:nowrap">${f}</td>`;
    let alt=0, di=0;
    while(di<7){
      const d=days[di], cls=cleansAt(f,d), rp=repAt(f,d), sin=stayIn(f,d), sout=stayOut(f,d), cov=covering(f,d);
      if(cls.length||rp||sin||sout){
        // event cell — the week.html clean-cell grammar: out فوق، النوع والوقت والكود، in تحت
        let cell='', bg=C.clean, hasClean=cls.length>0;
        if(rp&&!hasClean) bg=C.rep;
        if(hasClean){ const t=cls[0].type; if(t==='midstay'||t==='weekly') bg=C.mid; else if(t==='revision'||t==='codechange') bg=C.rev; }
        if(!hasClean&&!rp&&(sin||sout)) bg=sin?C.occ:'#fff';
        if(sout) cell+=`<div style="font-size:9px;color:var(--text2)">out <bdi>${short(sout.guest)}</bdi></div>`;
        cls.slice().sort((a,b)=>String(a.time||'99')<String(b.time||'99')?-1:1).forEach(c=>{
          cell+=`<div style="font-weight:800">${c.time&&/^\d/.test(String(c.time))?c.time:''}${c.type==='revision'?' إعادة':c.type==='codechange'?' كود':(c.type==='midstay'||c.type==='weekly')?' أثناء الإقامة':''}</div>`;
          if(c.code) cell+=`<div style="font-weight:900;color:var(--primary)">🔑 ${c.code}</div>`;
        });
        if(rp) cell+=`<div style="background:${C.rep};border-radius:4px;padding:0 3px;margin-top:1px">🔧 ${rp.trade||''}${rp.time&&/^\d/.test(String(rp.time))?' '+rp.time:''}</div>`;
        if(sin) cell+=`<div style="font-size:9px;color:#3a7d4d;font-weight:800">in <bdi>${short(sin.guest)}</bdi>${sin.arrivalTime?' '+sin.arrivalTime:''}</div>`;
        h+=`<td style="border:1px solid ${C.line};padding:2px;vertical-align:middle;text-align:center;height:46px;background:${bg}">${cell}</td>`;
        di++;
      } else if(cov){
        // stay span — merge consecutive covered days with no events (week.html colspan)
        let span=1;
        while(di+span<7&&covering(f,days[di+span])===cov&&!cleansAt(f,days[di+span]).length&&!repAt(f,days[di+span])&&!stayIn(f,days[di+span])&&!stayOut(f,days[di+span])) span++;
        const bg=(alt++%2)?C.occ2:C.occ;
        h+=`<td colspan="${span}" style="border:1px solid ${C.line};padding:2px;text-align:center;background:${bg};height:46px"><div style="font-weight:800;font-size:10.5px"><bdi>${cov.guest}</bdi> (${(cov.adults||0)+(cov.children||0)+(cov.infants||0)||1})</div></td>`;
        di+=span;
      } else { h+=`<td style="border:1px solid ${C.line};background:#fff;height:46px"></td>`; di++; }
    }
    h+='</tr>';
  });
  h+=`</table></div>
  <div class="step-sub" style="margin-top:6px;line-height:2">
    <span style="background:${C.occ};border-radius:4px;padding:1px 6px">إقامة</span>
    <span style="background:${C.clean};border-radius:4px;padding:1px 6px">تنظيف خروج</span>
    <span style="background:${C.mid};border-radius:4px;padding:1px 6px">أثناء الإقامة</span>
    <span style="background:${C.rev};border-radius:4px;padding:1px 6px">إعادة/كود</span>
    <span style="background:${C.rep};border-radius:4px;padding:1px 6px">🔧 صيانة</span>
    · in وصول · out مغادرة · 🔑 كود الباب</div>`;
  el.innerHTML=h;
}

/* صيانة — بيانات الهاب الحقيقية (repairs_data): التذاكر المفتوحة بالكامل + فتح بلاغ بكل الحقول.
   عماد وحده يقفل — القاعدة كما هي. */
function renderRep(){
  const el=document.getElementById('p-rep'); if(!el) return;
  const R=D.rep||{open:[],trades:[],flats:[]};
  let h='<div class="banner">🔧 الصيانة المفتوحة (من الهاب مباشرة) — عماد وحده يقفل البلاغات</div>';
  h+=(R.open&&R.open.length)?R.open.map(r=>`<div class="card" style="margin-bottom:8px">
      <div style="display:flex;gap:8px;align-items:center">
        <b style="font-size:13px">${r.flat}</b>
        <span class="badge b-soon">${r.trade||'—'}</span>
        <span class="step-sub" style="flex:1;text-align:left">${r.date||''}${r.time&&/^\d/.test(String(r.time))?' · '+r.time:''}</span>
        <button class="btn" onclick="editRepair('${r.id}')">✏️</button>
        <button class="btn" onclick="delRepair('${r.id}')">🗑️</button>
      </div>
      <div style="font-size:12px;margin-top:4px">${r.what||'—'}</div>
    </div>`).join(''):'<div class="card">لا صيانة مفتوحة ✨</div>';
  const fl=(R.flats&&R.flats.length)?R.flats:['8A','17A','28A','Zayed 2000','17B'];
  h+=`<div class="sec-h">فتح بلاغ صيانة</div>
    <select class="inp" id="rp-flat">${fl.map(f=>`<option>${f}</option>`).join('')}</select>
    <select class="inp" id="rp-trade">${(R.trades||[]).map(t=>`<option>${t}</option>`).join('')}<option value="__new">➕ نوع جديد…</option></select>
    <input class="inp" id="rp-what" placeholder="المشكلة — مثال: تسريب في حمام الضيوف">
    <input class="inp" id="rp-date" type="date">
    <input class="inp" id="rp-time" type="time">
    <button class="btn btn-ok" id="rp-btn" onclick="openRepair()">🔧 فتح البلاغ</button>`;
  el.innerHTML=h;
  const d=document.getElementById('rp-date'); if(d&&!d.value) d.value=D.today||'';
}
async function openRepair(){
  const flat=document.getElementById('rp-flat').value;
  let trade=document.getElementById('rp-trade').value;
  const what=document.getElementById('rp-what').value.trim();
  if(trade==='__new'){ const nt=prompt('اسم النوع الجديد:',''); if(!nt||!nt.trim()) return; trade=nt.trim(); }
  if(!what){ toast('اكتب المشكلة'); return; }
  const b=document.getElementById('rp-btn'); b.disabled=true; b.textContent='⏳';
  let r=null; try{ r=await api('repair_open',{flat,trade,what,newTrade:trade&&!(D.rep&&D.rep.trades||[]).includes(trade)?trade:'',date:document.getElementById('rp-date').value||D.today,time:document.getElementById('rp-time').value||''}); }catch(e){}
  b.disabled=false; b.textContent='🔧 فتح البلاغ';
  if(r&&(r.ok||r.success)){ toast('✅ اتفتح البلاغ — عماد هيتبلغ'); document.getElementById('rp-what').value=''; refreshRepairs(); }
  else toast('❌ لم يُحفظ — '+((r&&r.error)||'حاول مرة أخرى'));
}
/* ✏️/🗑️ on a repair REQUEST (Sarah 2026-08-22) — the server writes the Hub's Repairs sheet and
   busts every cache, so the change reaches the Hub and Emad's panel on their own; nothing to redo.
   Flat/trade stay fixed here: wrong flat means it's a different request — شيليه وافتحي واحد جديد. */
async function editRepair(id){
  const r=((D.rep&&D.rep.open)||[]).find(x=>String(x.id)===String(id)); if(!r) return;
  const what=prompt('المشكلة:',r.what||''); if(what===null) return;
  const dt=prompt('التاريخ (YYYY-MM-DD):',r.date||''); if(dt===null) return;
  const tm=prompt('الساعة (HH:MM أو فاضي):',r.time||''); if(tm===null) return;
  let res=null; try{ res=await api('repair_edit',{id,what:what.trim(),date:dt.trim(),time:tm.trim()}); }catch(e){}
  if(!res||!res.ok){ toast('❌ لم يتم — '+((res&&res.error)||'حاول مرة أخرى')); return; }
  toast('✏️ اتعدل البلاغ — وصل للهب وعماد'); refreshRepairs();
}
async function delRepair(id){
  const r=((D.rep&&D.rep.open)||[]).find(x=>String(x.id)===String(id));
  if(!confirm('حذف البلاغ ده نهائيًا؟'+(r?'\n'+r.flat+': '+(r.what||''):''))) return;
  let res=null; try{ res=await api('repair_delete',{id}); }catch(e){}
  if(!res||!res.ok){ toast('❌ لم يتم — '+((res&&res.error)||'حاول مرة أخرى')); return; }
  toast('🗑️ اتشال البلاغ — وصل للهب وعماد'); refreshRepairs();
}
async function refreshRepairs(){
  try{ const r=await api('repairs_data'); if(r&&r.ok){ D.rep={open:r.open||[],trades:r.trades||[],flats:r.flats||[]};
    try{ localStorage.setItem(CK,JSON.stringify({D,ts:lastTs})); }catch(e){} renderRep(); renderSched(); } }catch(e){}
}

window.addEventListener('load',function(){ initAuth(); var b=document.getElementById('langBtn'); if(b) b.textContent='🌐 '+tplDefLang().toUpperCase(); });
</script>
